<mat-form-field class="assignee-field" subscriptSizing="dynamic">
  <mat-select #select [value]="value" (selectionChange)="onSelectionChange($event.value)">
    <!-- Without a custom trigger, mat-select shows the option's text content, which includes the avatar's initials -->
    <mat-select-trigger>
      @if (select.value === "") {
        Unassigned
      } @else {
        <app-owner class="selected-owner" [ownerRef]="select.value"></app-owner>
      }
    </mat-select-trigger>
    <mat-option value="">
      <span class="unassigned-option">Unassigned</span>
    </mat-option>
    @for (userId of getOptions(); track userId) {
      <mat-option [value]="userId">
        <app-owner [ownerRef]="userId" [includeAvatar]="true"></app-owner>
      </mat-option>
    }
  </mat-select>
</mat-form-field>
